<!doctype html>
<!--
  Recording stage for screen-recorded coding tutorials (1920x1080).
  Left: the real editor (code-server) in an iframe. Right: a fake browser window whose
  iframe shows the real dev server, with a console drawer the driver fills from the
  page's real console messages. On top: full-screen slides (#ov), a caption box (#cap)
  and a step label (#step). Everything here is burned into the recording itself.

  JS API used by record_lesson.py:
    setEditor(url) setPreview(url) reloadPreview()
    slide(html) hideSlide() cap(text, full) step(text)
    consoleShow(on) consoleLog(level, text) consoleClear()
  Theme: edit the CSS variables below (accent colour, fonts).
-->
<html><head><meta charset="utf-8"><title>stage</title><style>
:root{--accent:#61dafb;--bg:#1e1e1e;--panel:#dee1e6;--cap-bg:rgba(20,24,31,.93);--font:"Segoe UI",Ubuntu,"DejaVu Sans",Arial,sans-serif;--mono:"DejaVu Sans Mono",Consolas,monospace}
html,body{margin:0;width:1920px;height:1080px;background:var(--bg);overflow:hidden;font-family:var(--font)}
#ed{position:absolute;left:0;top:0;width:1190px;height:1080px;border:0;background:#1e1e1e}
#br{position:absolute;left:1194px;top:0;width:726px;height:1080px;background:var(--panel);display:flex;flex-direction:column}
#bar{height:46px;flex:none;display:flex;align-items:center;padding:0 10px;gap:10px}
.dot{width:12px;height:12px;border-radius:6px;display:inline-block}
#nav{color:#5f6368;font-size:20px}
#url{flex:1;height:30px;border-radius:15px;background:#fff;display:flex;align-items:center;padding:0 14px;font-size:16px;color:#202124}
#url .lk{color:#5f6368;margin-right:8px}
#view{flex:1;position:relative;background:#fff}
#pv{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
#blank{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa0a6;font-size:20px}
#con{flex:none;height:0;overflow:hidden;background:#fff;border-top:1px solid #c7c7c7;font:15px/1.45 var(--mono);transition:height .25s}
#con.on{height:300px}
#con .hd{background:#f1f3f4;color:#3c4043;padding:6px 12px;font:600 14px var(--font);border-bottom:1px solid #ddd}
#con .ln{padding:4px 12px;border-bottom:1px solid #eee;white-space:pre-wrap;word-break:break-word;color:#202124}
#con .ln.error{background:#fff0f0;color:#c5221f;border-bottom-color:#fbd3d0}
#con .ln.warning{background:#fffbe6;color:#7a5c00;border-bottom-color:#fbeec2}
#ov{position:absolute;inset:0;display:none;z-index:10;color:#fff;background:radial-gradient(ellipse at 30% 20%,#1f3b57 0%,#0d1b2a 55%,#081018 100%)}
#ov .wrap{position:absolute;left:140px;right:140px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
#ov .kick{font-size:30px;letter-spacing:6px;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
#ov h1{font-size:92px;margin:0 0 26px;font-weight:800;line-height:1.05}
#ov h2{font-size:60px;margin:0 0 24px;font-weight:800}
#ov .sub{font-size:38px;color:#c9d6e3;line-height:1.4}
#ov table{border-collapse:collapse;font-size:34px}
#ov td{padding:14px 30px;border-bottom:1px solid #2c4a66}
#ov td:first-child{color:var(--accent);font-weight:700;font-family:var(--mono);white-space:nowrap}
#ov ol,#ov ul{font-size:36px;line-height:1.55;margin:0;padding-left:50px;color:#e6eef6}
#ov code{font-family:var(--mono);color:#ffd479;background:#13283d;padding:2px 10px;border-radius:6px}
#ov pre{font:30px/1.45 var(--mono);color:#e6eef6;background:#0b1622;border-left:6px solid var(--accent);padding:24px 30px;border-radius:10px;margin:0}
#cap{position:absolute;left:1214px;width:686px;bottom:26px;display:none;z-index:9;background:var(--cap-bg);color:#fff;font-size:27px;line-height:1.3;padding:14px 20px;border-radius:12px;border-left:6px solid var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.35);font-weight:600}
#cap.full{left:220px;right:220px;width:auto;text-align:center;border-left:0;border-bottom:5px solid var(--accent)}
#step{position:absolute;left:1214px;top:62px;display:none;z-index:9;background:var(--accent);color:#0d1b2a;font:700 22px var(--font);padding:6px 16px;border-radius:18px}
</style></head><body>
<iframe id="ed" src="about:blank"></iframe>
<div id="br">
 <div id="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
  <span id="nav">&#8592; &#8594; &#8635;</span><div id="url"><span class="lk">&#9432;</span><span id="urltext">New tab</span></div></div>
 <div id="view"><div id="blank">New tab</div><iframe id="pv"></iframe></div>
 <div id="con"><div class="hd">Console</div><div id="lines"></div></div>
</div>
<div id="ov"><div class="wrap" id="ovc"></div></div>
<div id="cap"></div><div id="step"></div>
<script>
const $=id=>document.getElementById(id);
function setEditor(u){$('ed').src=u;}
function setPreview(u){const pv=$('pv');$('urltext').textContent=u?u.replace(/^https?:\/\//,''):'New tab';
 if(!u){pv.style.display='none';$('blank').style.display='flex';pv.src='about:blank';return}
 $('blank').style.display='none';pv.style.display='block';pv.src=u;}
function reloadPreview(){const pv=$('pv');pv.src=pv.src;}
function slide(html){$('ovc').innerHTML=html;$('ov').style.display='block';}
function hideSlide(){$('ov').style.display='none';}
function cap(t,full){const c=$('cap');if(!t){c.style.display='none';return}c.className=full?'full':'';c.innerHTML=t;c.style.display='block';}
function step(t){const s=$('step');if(!t){s.style.display='none';return}s.textContent=t;s.style.display='block';}
function consoleShow(on){$('con').classList.toggle('on',!!on);}
function consoleClear(){$('lines').innerHTML='';}
function consoleLog(level,text){const d=document.createElement('div');d.className='ln '+(level||'log');d.textContent=text;
 const L=$('lines');L.appendChild(d);while(L.children.length>12)L.removeChild(L.firstChild);}
</script></body></html>
