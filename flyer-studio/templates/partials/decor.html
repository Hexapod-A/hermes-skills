{{#decor_corner}}
<div class="decor decor-corner" data-decor>
  <div class="c a" style="--x:0;--y:0;--w:1.75;--h:2.1"></div>
  <div class="c b" style="--x:0.42;--y:0.42;--w:0.9;--h:0.9"></div>
  <div class="c f" style="--x:1.75;--y:1.05;--w:0.5;--h:0.5"></div>
  <div class="c a" style="--x:2.25;--y:0;--w:1.6;--h:1.55"></div>
  <div class="c f" style="--x:3.85;--y:0;--w:0.5;--h:0.5"></div>
  <div class="c a" style="--x:4.35;--y:0.5;--w:0.5;--h:0.5"></div>
  <svg class="arrow" viewBox="0 0 64 64" style="right:calc(0.42 * var(--u) + 0.45 * var(--u) - 32px);bottom:calc(0.42 * var(--u) + 0.45 * var(--u) - 32px)" aria-hidden="true"><path d="M8 8 L56 56 M8 8 L8 40 M8 8 L40 8"/></svg>
</div>
{{/decor_corner}}
{{#decor_edge}}
<div class="decor decor-edge" data-decor>
  <div class="c a" style="--x:0;--y:0;--w:1.5;--h:2.6"></div>
  <div class="c f" style="--x:1.5;--y:2.6;--w:0.5;--h:0.5"></div>
  <div class="c a" style="--x:0;--y:3.6;--w:1;--h:1.7"></div>
  <div class="c f" style="--x:1;--y:5.3;--w:0.5;--h:0.5"></div>
  <div class="c a" style="--x:0;--y:6.9;--w:1.7;--h:1.1"></div>
  <div class="c f" style="--x:0;--y:9.2;--w:0.5;--h:0.5"></div>
  <div class="c a" style="--x:0;--y:10.6;--w:1.2;--h:2"></div>
  <div class="c f" style="--x:1.2;--y:12.6;--w:0.5;--h:0.5"></div>
  <div class="c a" style="--x:0;--y:13.8;--w:1.6;--h:1.3"></div>
  <div class="c f" style="--x:0;--y:16.2;--w:0.5;--h:0.5"></div>
  <div class="c a" style="--x:0;--y:17.4;--w:1;--h:1.6"></div>
</div>
<svg class="arrow" viewBox="0 0 64 64" style="right:calc(2.2 * var(--u) + 24px);bottom:72px" aria-hidden="true" data-decor><path d="M8 8 L56 56 M8 8 L8 40 M8 8 L40 8"/></svg>
{{/decor_edge}}
{{#decor_stairs}}
<div class="decor decor-stairs" data-decor>
  <div class="s" style="left:0;bottom:0"></div>
  <div class="s" style="left:calc(var(--u)/2);bottom:calc(var(--u)/2)"></div>
  <div class="s" style="left:var(--u);bottom:var(--u)"></div>
</div>
{{/decor_stairs}}
